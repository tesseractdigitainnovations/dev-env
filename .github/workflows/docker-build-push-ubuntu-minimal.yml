name: Build and Push Docker Image Ubuntu Minimal

on:
  schedule:
    # Runs weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    name: Build and Push to GHCR on Ubuntu Minimal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Clean runner Docker cache
        run: |
          docker image prune -af || true

      - name: Set lowercased image name

      - name: Set lowercased image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ubuntu-minimal,enable=${{ github.ref == 'refs/heads/ubuntu' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=ubuntu-minimal-sha-,enable=true

      - name: Build and Push Docker Image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ubuntu.minimal
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        id: attest
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Show Final Image Size
        if: always() && steps.build-and-push.conclusion == 'success'
        run: |
          python3 scripts/report-image-size.py \
            --image "${{ env.IMAGE_NAME }}" \
            --tags '${{ steps.meta.outputs.tags }}' \
            --digest "${{ steps.build-and-push.outputs.digest }}"