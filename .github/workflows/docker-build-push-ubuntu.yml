name: Build and Push Docker Image Ubuntu

on:
  # schedule:
    # Runs at 01:00 UTC every 3 days
    # - cron: '0 1 */3 * *'

  # push:
  #   branches:
  #     - ubuntu
  #   paths:
  #     - 'Dockerfile'
  #     - 'Dockerfile.ubuntu'
  #     - '.claude/**'
  #     - 'docker-compose.yaml'
  #     - 'README.md'
  #     - 'CLAUDE.md'
  #     - '.github/workflows/docker-build-push-ubuntu.yml'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push to GHCR on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/dev-env-secure-container
          tags: |
            type=raw,value=ubuntu,enable=${{ github.ref == 'refs/heads/ubuntu' }}
            type=sha,prefix=ubuntu-sha-,enable=true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ubuntu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max