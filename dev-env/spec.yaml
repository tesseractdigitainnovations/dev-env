schemaVersion: "2"
kind: sandbox
name: coding-bot
displayName: Coding Sandbox
description: An isolated container sandbox pre-loaded with coding tools, AWS access, and custom workflows.

sandbox:
  image: "ghcr.io/tesseractdigitainnovations/dev-env:ubuntu-minimal-sha-599021d"
  build:
    context: .
    dockerfile: Dockerfile.sbx
  entrypoint: ["/bin/bash"]

agentInstructions:
  filename: README.md
  content: |
    ## Coding Sandbox

    You are running inside a secure Docker Sandbox pre-loaded with essential coding tools.

environment:
  variables:
    IS_SANDBOX: "1"
    AWS_REGION: "us-east-1"
    AWS_PROFILE: claude-bedrock
    EDITOR: "nano"
    CLAUDE_CODE_USE_BEDROCK: "1"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "us.anthropic.claude-opus-5"
    ANTHROPIC_DEFAULT_OPUS_BACKUP_1: "us.anthropic.claude-opus-4-6-v1"
    ANTHROPIC_DEFAULT_OPUS_BACKUP_2: "us.anthropic.claude-opus-4-5-20251101-v1:0"
    ANTHROPIC_DEFAULT_FABLE_MODEL: "us.anthropic.claude-fable-5"
    DOCKER_HOST: "tcp://host.docker.internal:2375"

permissions:
  network:
    allow:
      # AWS endpoints (for Bedrock and AWS CLI)
      - "amazonaws.com:443"
      - "*.amazonaws.com:443"
      # AI Model Providers
      - "api.anthropic.com:443"
      - "*.anthropic.com:443"
      - "api.openai.com:443"
      - "*.openai.com:443"
      - "generativelanguage.googleapis.com:443"
      - "*.googleapis.com:443"
      # Package registries & updates
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      - "github.com:443"
      - "*.github.com:443"
      - "api.github.com:443"
      - "*.githubusercontent.com:443"
      # Docker registries
      - "registry-1.docker.io:443"
      - "auth.docker.io:443"
      # Other common coding resources
      - "crates.io:443"
      - "rubygems.org:443"
      - "npmjs.org:443"
      - "registry.npmjs.org:443"
      # Host / local network
      - "host.docker.internal:*"
      - "192.168.0.59:*"
      - "*.internal.xboy.me:443"
      - "localhost:*"

setup:
  install:
    - command: |
        mkdir -p /home/agent
        chown agent:agent /home/agent
        mkdir -p /home/agent/.claude
        chown -R agent:agent /home/agent/.claude
      user: root
      description: Ensure /home/agent and .claude exist with correct agent ownership

    - command: |
        set -e

        install_skill() {
          local repo="$1" skill="$2"
          if [ ! -d "/home/agent/.claude/skills/$skill" ]; then
            npx --yes skills add "$repo" --skill "$skill"
          fi
        }

        # ── Agent discovery & workflow ────────────────────────────────────
        install_skill https://github.com/vercel-labs/skills find-skills
        install_skill https://github.com/obra/superpowers brainstorming
        install_skill https://github.com/obra/superpowers writing-plans
        install_skill https://github.com/obra/superpowers executing-plans
        install_skill https://github.com/obra/superpowers systematic-debugging
        install_skill https://github.com/obra/superpowers requesting-code-review
        install_skill https://github.com/obra/superpowers subagent-driven-development
        install_skill https://github.com/obra/superpowers dispatching-parallel-agents

        # ── Skill development ─────────────────────────────────────────────
        install_skill https://github.com/anthropics/skills skill-creator

        # ── TypeScript / NestJS architecture ──────────────────────────────
        install_skill https://github.com/kadajett/agent-nestjs-skills nestjs-best-practices
        install_skill https://github.com/mattpocock/skills improve-codebase-architecture

        # ── Python / Flask ────────────────────────────────────────────────
        install_skill https://github.com/obra/superpowers python
        install_skill https://github.com/obra/superpowers flask

        # ── Testing & quality ─────────────────────────────────────────────
        install_skill https://github.com/mattpocock/skills tdd
        install_skill https://github.com/microsoft/playwright-cli playwright-cli

        # ── React / Next.js / Vercel ──────────────────────────────────────
        install_skill https://github.com/vercel-labs/agent-skills vercel-react-best-practices
        install_skill https://github.com/vercel-labs/agent-skills vercel-composition-patterns
        install_skill https://github.com/vercel-labs/agent-skills web-design-guidelines

        # ── Frontend / UI ─────────────────────────────────────────────────
        install_skill https://github.com/anthropics/skills frontend-design

        # ── React Native / Expo ────────────────────────────────────────────
        install_skill https://github.com/expo/skills building-native-ui

        # ── React / Vite / Dashboard UI ─────────────────────────────────────
        install_skill https://github.com/google-labs-code/stitch-skills react-vite-dashboard

        # ── Browser automation ────────────────────────────────────────────
        install_skill https://github.com/browser-use/browser-use browser-use

        # ── Research / business intelligence ──────────────────────────────
        install_skill https://github.com/ethansei/skills deep-research
        install_skill https://github.com/coreyhaines31/marketingskills competitor-profiling
        install_skill https://github.com/coreyhaines31/marketingskills pricing-strategy
      user: agent
      description: Install curated full-stack, Python/Flask, agent-workflow, research and business skills via npx skills CLI (idempotent)

  files:
    - path: /home/agent/.claude/settings.json
      content: |
        {
          "alwaysThinkingEnabled": true,
          "theme": "dark",
          "themeId": 1,
          "defaultMode": "bypassPermissions",
          "bypassPermissionsModeAccepted": true,
          "skipDangerousModePermissionPrompt": true
        }
      onlyIfMissing: true
      mode: "0644"
      description: Claude settings (Bedrock auth, no proxy-managed key)

    - path: /home/agent/.claude.json
      content: |
        {
          "bypassPermissionsModeAccepted": true,
          "hasCompletedOnboarding": true,
          "projects": {
            "/": { "hasTrustDialogAccepted": true },
            "/workspace": { "hasTrustDialogAccepted": true }
          }
        }
      onlyIfMissing: true
      description: Claude bypass flags (mode-independent)