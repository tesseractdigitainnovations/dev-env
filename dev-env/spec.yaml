schemaVersion: "2"
kind: sandbox
name: coding-bot
displayName: Coding Sandbox
description: An isolated container sandbox pre-loaded with coding tools, AWS access, and custom workflows.

sandbox:
  image: "ghcr.io/tesseractdigitainnovations/dev-env:ubuntu-minimal-sha-599021d"
  build:
    context: .
    dockerfile: Dockerfile.sbx
  entrypoint: ["/bin/bash"]

agentInstructions:
  filename: README.md
  content: |
    ## Coding Sandbox

    You are running inside a secure Docker Sandbox pre-loaded with essential coding tools.

environment:
  variables:
    IS_SANDBOX: "1"
    AWS_REGION: "us-east-1"
    AWS_PROFILE: claude-bedrock
    EDITOR: "nano"
    CLAUDE_CODE_USE_BEDROCK: "1"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "us.anthropic.claude-opus-5"
    ANTHROPIC_DEFAULT_OPUS_BACKUP_1: "us.anthropic.claude-opus-4-6-v1"
    ANTHROPIC_DEFAULT_OPUS_BACKUP_2: "us.anthropic.claude-opus-4-5-20251101-v1:0"
    ANTHROPIC_DEFAULT_FABLE_MODEL: "us.anthropic.claude-fable-5"
    DOCKER_HOST: "tcp://host.docker.internal:2375"

permissions:
  network:
    allow:
      # AWS endpoints (for Bedrock and AWS CLI)
      - "amazonaws.com:443"
      - "*.amazonaws.com:443"
      # AI Model Providers
      - "api.anthropic.com:443"
      - "*.anthropic.com:443"
      - "api.openai.com:443"
      - "*.openai.com:443"
      - "generativelanguage.googleapis.com:443"
      - "*.googleapis.com:443"
      # Package registries & updates
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      - "github.com:443"
      - "*.github.com:443"
      - "api.github.com:443"
      - "*.githubusercontent.com:443"
      # Docker registries
      - "registry-1.docker.io:443"
      - "auth.docker.io:443"
      # Other common coding resources
      - "crates.io:443"
      - "rubygems.org:443"
      - "npmjs.org:443"
      - "registry.npmjs.org:443"
      # Skills registry (needed by `skills find` / `skills add`)
      - "skills.sh:443"
      - "*.skills.sh:443"
      # Host / local network
      - "host.docker.internal:*"
      - "192.168.0.59:*"
      - "*.internal.xboy.me:443"
      - "localhost:*"

setup:
  install:
    - command: |
        mkdir -p /home/agent
        chown agent:agent /home/agent
        mkdir -p /home/agent/.claude
        chown -R agent:agent /home/agent/.claude
      user: root
      description: Ensure /home/agent and .claude exist with correct agent ownership

    # Skills are baked into the image at build time by scripts/install-skills.sh
    # (the `skills` CLI blocks on a scope/agent prompt here and hangs launch).
    # Re-run /home/agent/.local/bin/install-skills.sh inside the sandbox if you
    # need to add skills without rebuilding.

  files:
    - path: /home/agent/.claude/settings.json
      content: |
        {
          "alwaysThinkingEnabled": true,
          "theme": "dark",
          "themeId": 1,
          "defaultMode": "bypassPermissions",
          "bypassPermissionsModeAccepted": true,
          "skipDangerousModePermissionPrompt": true
        }
      onlyIfMissing: true
      mode: "0644"
      description: Claude settings (Bedrock auth, no proxy-managed key)

    - path: /home/agent/.claude.json
      content: |
        {
          "bypassPermissionsModeAccepted": true,
          "hasCompletedOnboarding": true,
          "projects": {
            "/": { "hasTrustDialogAccepted": true },
            "/workspace": { "hasTrustDialogAccepted": true }
          }
        }
      onlyIfMissing: true
      description: Claude bypass flags (mode-independent)