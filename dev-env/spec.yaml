schemaVersion: "2"
kind: sandbox
name: coding-bot
displayName: Coding Sandbox
description: An isolated container sandbox pre-loaded with coding tools, AWS access, and custom workflows.

sandbox:
  image: "ghcr.io/tesseractdigitainnovations/dev-env:ubuntu-minimal-sha-8dd7e9d"
  build:
    context: .
    dockerfile: Dockerfile.sbx
  entrypoint: ["/bin/bash"]

agentInstructions:
  filename: README.md
  content: |
    ## Coding Sandbox

    You are running inside a secure Docker Sandbox pre-loaded with essential coding tools.

environment:
  variables:
    IS_SANDBOX: "1"
    AWS_REGION: "us-east-1"
    AWS_PROFILE: claude-bedrock
    EDITOR: "nano"
    CLAUDE_CODE_USE_BEDROCK: "1"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "us.anthropic.claude-sonnet-4-20250514-v1:0"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "us.anthropic.claude-opus-5"
    ANTHROPIC_DEFAULT_OPUS_BACKUP_1: "us.anthropic.claude-opus-4-6-v1"
    ANTHROPIC_DEFAULT_OPUS_BACKUP_2: "us.anthropic.claude-opus-4-5-20251101-v1:0"
    ANTHROPIC_DEFAULT_FABLE_MODEL: "us.anthropic.claude-fable-5"
    DOCKER_HOST: "tcp://host.docker.internal:2375"

permissions:
  network:
    allow:
      # AWS endpoints (for Bedrock and AWS CLI)
      - "amazonaws.com:443"
      - "*.amazonaws.com:443"
      # AI Model Providers
      - "api.anthropic.com:443"
      - "*.anthropic.com:443"
      - "api.openai.com:443"
      - "*.openai.com:443"
      - "generativelanguage.googleapis.com:443"
      - "*.googleapis.com:443"
      # Package registries & updates
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      - "github.com:443"
      - "*.github.com:443"
      - "api.github.com:443"
      - "*.githubusercontent.com:443"
      # Docker registries
      - "registry-1.docker.io:443"
      - "auth.docker.io:443"
      # Other common coding resources
      - "crates.io:443"
      - "rubygems.org:443"
      - "npmjs.org:443"
      - "registry.npmjs.org:443"
      - "host.docker.internal:*"