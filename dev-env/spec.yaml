schemaVersion: "1"
kind: sandbox
name: coding-bot
displayName: Coding Sandbox
description: An isolated container sandbox pre-loaded with coding tools, AWS access, and custom workflows.

security:
  privileged: true

sandbox:
  image: "ghcr.io/tesseractdigitainnovations/dev-env:ubuntu-sha-949394d"
  build:
    context: .
    dockerfile: Dockerfile.sbx
  aiFilename: README.md
  entrypoint:
    run: ["/bin/bash"]

environment:
  variables:
    IS_SANDBOX: "1"
    AWS_REGION: "us-east-1"
    AWS_PROFILE: claude-bedrock
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/agent/.local/bin"
    EDITOR: "nano"
    # Add other coding-related environment variables as needed
    CLAUDE_CODE_USE_BEDROCK: "1"
    # Pin model versions (recommended)
    ANTHROPIC_DEFAULT_SONNET_MODEL: "us.anthropic.claude-opus-4-5-20251101-v1:0"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "us.anthropic.claude-opus-5"

caps:
  network:
    allow:
      # AWS endpoints (for Bedrock and AWS CLI)
      - "amazonaws.com:443"
      - "*.amazonaws.com:443"
      # AI Model Providers
      - "api.anthropic.com:443"
      - "*.anthropic.com:443"
      - "api.openai.com:443"
      - "*.openai.com:443"
      - "generativelanguage.googleapis.com:443"
      - "*.googleapis.com:443"
      # Package registries & updates
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      - "github.com:443"
      - "*.github.com:443"
      - "api.github.com:443"
      - "*.githubusercontent.com:443"
      # Docker registries
      - "registry-1.docker.io:443"
      - "auth.docker.io:443"
      # Other common coding resources
      - "crates.io:443"
      - "rubygems.org:443"
      - "npmjs.org:443"
      - "registry.npmjs.org:443"

agentContext: |
  ## Coding Sandbox

  You are running inside a secure Docker Sandbox pre-loaded with essential coding tools.

  ### Pre-Installed Coding Tools & Usage

  - `git/gh`: Version control
  - `python3`, `pip`: Python development
  - `node`, `npm`: Node.js development
  - `docker`, `docker compose`: Container development
  - `vim`, `nano`: Editors

  ### Execution Instructions

  - All tools are available in the system `PATH`.