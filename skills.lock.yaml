# Pinned, safety-reviewed skill set for the dev-env image.
#
# Every entry is installed from the exact commit in `ref` by
# scripts/install-skills.sh at image build time. Nothing is resolved at
# runtime, so a rebuild cannot silently pull in upstream changes.
#
# `reviewed` is the date the skill's full contents (SKILL.md, references and
# any bundled scripts) were audited at that ref for:
#   * reads of sensitive files/config (~/.aws, ~/.ssh, .npmrc, kubeconfig,
#     .claude.json, token env vars, shell history)
#   * outbound network calls / data exfiltration
#   * recommendations to install non-official tooling
#
# Bumping a `ref` invalidates its review — re-audit and update `reviewed`.
#
# Removed by review (do not re-add without justification):
#   * vercel-labs/skills find-skills @ c6f69c631292444cc541ac6d91e2226b0ff247da
#     Exists to discover and install arbitrary unvetted community skills, and
#     points at the third-party aggregator ComposioHQ/awesome-claude-skills.

